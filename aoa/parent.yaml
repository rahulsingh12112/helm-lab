apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aoa-parent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rahulsingh12112/helm-lab.git
    targetRevision: main
    path: aoa/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
