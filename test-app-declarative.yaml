apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-app-2
  namespace: argocd           # Application object hamesha argocd ns me
spec:
  project: default
  source:
    repoURL: https://github.com/rahulsingh12112/helm-lab.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: test-app-2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
